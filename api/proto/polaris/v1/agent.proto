syntax = "proto3";

package polaris.v1;

option go_package = "github.com/cuijianzhuang/polaris/api/gen/polaris/v1;polarisv1";

// AgentService is served by the panel; agents always dial out, so nodes never
// expose a management port and NAT'd hosts can join.
service AgentService {
  // Enroll exchanges a one-time install token for a client certificate.
  // It is the only RPC callable without a client certificate.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Connect is the long-lived bidirectional stream (mTLS).
  rpc Connect(stream AgentMessage) returns (stream PanelMessage);
  // GetSpec pulls the desired NodeSpec.
  rpc GetSpec(GetSpecRequest) returns (GetSpecResponse);
  // ReportTraffic uploads traffic batches; accepted batch ids are idempotent.
  rpc ReportTraffic(ReportTrafficRequest) returns (ReportTrafficResponse);
}

message EnrollRequest {
  string token = 1;
  bytes csr_pem = 2;
  string hostname = 3;
  string agent_version = 4;
}

message EnrollResponse {
  string node_id = 1;
  bytes cert_pem = 2;
  bytes ca_pem = 3;
}

message AgentMessage {
  oneof msg {
    Heartbeat heartbeat = 1;
    ApplyResult apply_result = 2;
    CommandResult command_result = 3;
    OnlineIPs online_ips = 4;
    Progress progress = 5;
  }
}

// Progress reports what the agent is busy with (applying a revision,
// downloading a core, upgrading itself) so the panel can show it live.
// Sent when the step changes and at most about once a second while bytes
// move; active=false ends it. Older panels ignore it.
message Progress {
  bool active = 1;
  // Step shown to the admin, e.g. "下载 xray 26.3.27".
  string stage = 2;
  // Bytes (or steps) done and expected; total 0 = unknown.
  int64 done = 3;
  int64 total = 4;
  // Revision being applied, 0 when not applying one.
  int64 rev = 5;
  // Unix time the activity began.
  int64 started_at = 6;
  // Set on the final message when the activity failed.
  string error = 7;
}

message Heartbeat {
  int64 applied_rev = 1;
  string agent_version = 2;
  SystemStats system = 3;
  repeated CoreState cores = 4;
  // Public addresses detected by the agent (for DDNS); empty if unknown.
  string public_ipv4 = 5;
  string public_ipv6 = 6;
  // CPU architecture (GOARCH: amd64 / arm64), so the panel only caches the
  // agent builds its nodes need. Empty from older agents.
  string arch = 7;
  // Users under a per-user speed limit on this node, with their current
  // speed. Empty from older agents.
  repeated LimitedUser limited = 8;
  // Absent from older agents; counters are scoped to this agent process.
  TrafficQueueStatus traffic_queue = 9;
}

message LimitedUser {
  string user_id = 1;
  int32 up_kbps = 2;   // allowance, 0 = unlimited
  int32 down_kbps = 3;
  int64 up_bps = 4;    // measured since the previous heartbeat
  int64 down_bps = 5;
}

message SystemStats {
  double cpu_percent = 1;
  double mem_percent = 2;
  uint64 rx_bps = 3;
  uint64 tx_bps = 4;
  uint64 uptime_seconds = 5;
  double load1 = 6;
  // Cumulative bytes on the host's network interfaces (excluding loopback
  // and container bridges) since boot; the panel accumulates the deltas.
  uint64 rx_bytes = 7;
  uint64 tx_bytes = 8;
  // Hash of boot ID and the sampled interface identities. A change requires
  // a fresh baseline, never replay of the interfaces' lifetime counters.
  string net_epoch = 9;
  uint64 net_sample_uptime_millis = 10;
  // Distinguishes an observed zero counter from an unavailable sample.
  bool net_counters_valid = 11;
}

message CoreState {
  string type = 1;
  string version = 2;
  bool running = 3;
  int32 pid = 4;
  int64 started_at = 5;
  string error = 6;
  int32 inbounds = 7;
  repeated string installed_versions = 8;
  // no_user_traffic: the core cannot attribute traffic to users (an official
  // sing-box build without v2ray_api). Older agents never set it.
  bool no_user_traffic = 9;
}

message ApplyResult {
  int64 rev = 1;
  bool ok = 2;
  string error = 3;
  bool rolled_back = 4;
  // "hot" when only users changed and every core hot-updated, else "reload".
  string method = 5;
}

message CommandResult {
  string id = 1;
  bool ok = 2;
  string error = 3;
  string output = 4;
}

message OnlineIPs {
  repeated UserIPs users = 1;
}

message UserIPs {
  string user_id = 1;
  repeated string ips = 2;
}

message PanelMessage {
  oneof msg {
    SpecChanged spec_changed = 1;
    Command command = 2;
  }
}

message SpecChanged {
  int64 rev = 1;
}

// Command is a structured instruction; the agent never runs arbitrary shell.
message Command {
  string id = 1;
  // restart_core | install_core | core_logs | probe | rollback
  string kind = 2;
  map<string, string> args = 3;
}

message GetSpecRequest {
  // 0 means the latest revision.
  int64 rev = 1;
}

message GetSpecResponse {
  int64 rev = 1;
  bytes spec_json = 2;
}

message ReportTrafficRequest {
  repeated TrafficBatch batches = 1;
}

message TrafficBatch {
  string batch_id = 1;
  int64 collected_at = 2;
  repeated UserTraffic users = 3;
  // seq numbers the agent's batches within epoch, from 1. The panel keeps
  // the highest seq it accepted per node and epoch, so a replay counts once
  // however late it comes. 0 = an older agent: deduplicated by batch_id.
  uint64 seq = 4;
  // epoch is chosen when the agent starts its traffic queue (a reinstall
  // starts a new one).
  string epoch = 5;
}

message UserTraffic {
  string user_id = 1;
  int64 up = 2;
  int64 down = 3;
}

message ReportTrafficResponse {
  repeated string accepted_batch_ids = 1;
}

message TrafficQueueStatus {
  uint32 pending_batches = 1;
  int64 oldest_unacked_at = 2;
  bool persistence_failed = 3;
  uint64 dropped_batches = 4;
}
