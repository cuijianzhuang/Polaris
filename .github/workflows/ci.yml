name: ci
on:
  # main is tested by the release workflow, which calls this one on every
  # merge; listing it here too would run the whole suite twice.
  push:
    branches: ['claude/**']
  pull_request:
  workflow_call:

# A new push to a pull request cancels the run for the previous commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The Go suites run as parallel jobs (they took ~22 minutes back to back).
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U polaris" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POLARIS_TEST_POSTGRES_DSN: postgres://polaris:polaris@127.0.0.1:5432/polaris?sslmode=disable
      POLARIS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch real cores for integration tests
        run: |
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip && unzip -q xray.zip -d xray
          curl -fsSL -o xray-egress.zip https://github.com/XTLS/Xray-core/releases/download/v26.5.9/Xray-linux-64.zip && unzip -q xray-egress.zip -d xray-egress
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.13.5/sing-box-1.13.5-linux-amd64.tar.gz | tar xz
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.15/mihomo-linux-amd64-v1.19.15.gz | gunzip > mihomo && chmod +x mihomo
          mkdir -p caddy
          curl -fsSL -o caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz
          echo '5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd  caddy.tar.gz' | sha256sum -c -
          tar xzf caddy.tar.gz -C caddy caddy
          mkdir -p gost && curl -fsSL https://github.com/go-gost/gost/releases/download/v3.2.6/gost_3.2.6_linux_amd64.tar.gz | tar xz -C gost
          mkdir -p pebble && curl -fsSL https://github.com/letsencrypt/pebble/releases/download/v2.7.0/pebble-linux-amd64.tar.gz | tar xz -C pebble --strip-components=3
          B=https://raw.githubusercontent.com/letsencrypt/pebble/v2.7.0/test
          curl -fsSL -o pebble/config.json $B/config/pebble-config.json
          curl -fsSL -o pebble/cert.pem $B/certs/localhost/cert.pem
          curl -fsSL -o pebble/key.pem $B/certs/localhost/key.pem
          curl -fsSL -o pebble/pebble.minica.pem $B/certs/pebble.minica.pem
          chmod +x pebble/pebble
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          POLARIS_XRAY_BIN: /tmp/cores/xray/xray
          POLARIS_XRAY_EGRESS_BIN: /tmp/cores/xray-egress/xray
          POLARIS_SINGBOX_BIN: /tmp/cores/sing-box-1.13.5-linux-amd64/sing-box
          POLARIS_MIHOMO_BIN: /tmp/cores/mihomo
          POLARIS_GOST_BIN: /tmp/cores/gost/gost
          POLARIS_CADDY_BIN: /tmp/cores/caddy/caddy
          POLARIS_PEBBLE_DIR: /tmp/cores/pebble
      - name: Firewall test with real iptables (isolated network namespace)
        run: go test -c -o /tmp/agent.test ./internal/agent && sudo env POLARIS_FW_REAL=1 unshare -n /tmp/agent.test -test.run TestFirewallIptablesReal -test.v
  go-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U polaris" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POLARIS_TEST_POSTGRES_DSN: postgres://polaris:polaris@127.0.0.1:5432/polaris?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Panel tests on PostgreSQL
        run: go test -count=1 ./internal/panel/
        env:
          POLARIS_TEST_ALL_POSTGRES: '1'
  go-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POLARIS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Panel tests with Redis shared state
        run: go test -count=1 ./internal/panel/
        env:
          POLARIS_TEST_ALL_REDIS: '1'
  go-pro:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U polaris" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POLARIS_TEST_POSTGRES_DSN: postgres://polaris:polaris@127.0.0.1:5432/polaris?sslmode=disable
      POLARIS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch real cores for integration tests
        run: |
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip && unzip -q xray.zip -d xray
          curl -fsSL -o xray-egress.zip https://github.com/XTLS/Xray-core/releases/download/v26.5.9/Xray-linux-64.zip && unzip -q xray-egress.zip -d xray-egress
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.13.5/sing-box-1.13.5-linux-amd64.tar.gz | tar xz
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.15/mihomo-linux-amd64-v1.19.15.gz | gunzip > mihomo && chmod +x mihomo
          mkdir -p gost && curl -fsSL https://github.com/go-gost/gost/releases/download/v3.2.6/gost_3.2.6_linux_amd64.tar.gz | tar xz -C gost
          mkdir -p pebble && curl -fsSL https://github.com/letsencrypt/pebble/releases/download/v2.7.0/pebble-linux-amd64.tar.gz | tar xz -C pebble --strip-components=3
          B=https://raw.githubusercontent.com/letsencrypt/pebble/v2.7.0/test
          curl -fsSL -o pebble/config.json $B/config/pebble-config.json
          curl -fsSL -o pebble/cert.pem $B/certs/localhost/cert.pem
          curl -fsSL -o pebble/key.pem $B/certs/localhost/key.pem
          curl -fsSL -o pebble/pebble.minica.pem $B/certs/pebble.minica.pem
          chmod +x pebble/pebble
      - name: Professional edition (polaris-pro sources, when PRO_TOKEN is available)
        env:
          PRO_TOKEN: ${{ secrets.PRO_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          POLARIS_XRAY_BIN: /tmp/cores/xray/xray
          POLARIS_XRAY_EGRESS_BIN: /tmp/cores/xray-egress/xray
          POLARIS_SINGBOX_BIN: /tmp/cores/sing-box-1.13.5-linux-amd64/sing-box
          POLARIS_MIHOMO_BIN: /tmp/cores/mihomo
        run: |
          set -euo pipefail
          if [ -z "${PRO_TOKEN}" ]; then echo "PRO_TOKEN not available: community edition only"; exit 0; fi
          url="https://x-access-token:${PRO_TOKEN}@github.com/cuijianzhuang/polaris-pro.git"
          # the same branch name in polaris-pro when it exists, else main
          git clone -q --depth 1 --branch "$BRANCH" "$url" /tmp/polaris-pro 2>/dev/null || git clone -q --depth 1 "$url" /tmp/polaris-pro
          scripts/pro.sh copy /tmp/polaris-pro
          go vet -tags pro ./...
          go test -count=1 -tags pro ./internal/panel/ ./internal/agent/ ./internal/license/
          scripts/pro.sh clean
  singbox-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build pinned sing-box with diagnostic prerequisites
        run: |
          git clone --depth 1 --branch v1.13.5 https://github.com/SagerNet/sing-box.git /tmp/diagnostic-singbox-src
          test "$(git -C /tmp/diagnostic-singbox-src rev-parse HEAD)" = 7ffdc48b49718d6aeee19ede523a31d1286724cf
          cd /tmp/diagnostic-singbox-src
          go build -tags with_v2ray_api,with_utls,with_clash_api -ldflags '-X github.com/sagernet/sing-box/constant.Version=1.13.5' -o /tmp/diagnostic-singbox ./cmd/sing-box
      - name: Verify real relay authentication, traffic and credential revocation
        run: go test -race -count=1 -v ./internal/core/singbox -run 'TestLiveSingbox|TestDiagnosticRefuses'
        env:
          POLARIS_SINGBOX_DIAGNOSTIC_BIN: /tmp/diagnostic-singbox
  snell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build pinned Snell multi-user core with real traffic counters
        run: |
          git clone --depth 1 --branch v1.14.4 https://github.com/SagerNet/sing-box.git /tmp/snell-src
          test "$(git -C /tmp/snell-src rev-parse HEAD)" = c005f35300ce76427dc285481ec5695f5b179cd2
          cd /tmp/snell-src
          go build -tags with_v2ray_api,with_clash_api -ldflags '-X github.com/sagernet/sing-box/constant.Version=1.14.4' -o /tmp/snell-core ./cmd/sing-box
      - name: Verify native TCP/UDP, per-user billing and revocation
        run: go test -count=1 -v ./internal/core/singbox ./internal/panel -run Snell
        env:
          POLARIS_SNELL_BIN: /tmp/snell-core
      - name: Verify external source references with real per-user statistics
        run: |
          mkdir -p /tmp/source-xray
          curl -fsSL -o /tmp/source-xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          unzip -q /tmp/source-xray.zip -d /tmp/source-xray
          go test -count=1 -v ./internal/panel -run '^TestLiveSourceReference'
        env:
          POLARIS_XRAY_BIN: /tmp/source-xray/xray
          POLARIS_SINGBOX_BIN: /tmp/snell-core
      - name: Verify Snell through the professional per-user limiter
        env:
          PRO_TOKEN: ${{ secrets.PRO_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          POLARIS_SNELL_BIN: /tmp/snell-core
        run: |
          set -euo pipefail
          if [ -z "${PRO_TOKEN}" ]; then echo "PRO_TOKEN not available: skipping professional limiter"; exit 0; fi
          url="https://x-access-token:${PRO_TOKEN}@github.com/cuijianzhuang/polaris-pro.git"
          git clone -q --depth 1 --branch "$BRANCH" "$url" /tmp/snell-pro 2>/dev/null || git clone -q --depth 1 "$url" /tmp/snell-pro
          scripts/pro.sh copy /tmp/snell-pro
          go test -tags pro -count=1 -v ./internal/agent -run Snell
          scripts/pro.sh clean
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker frontend with shared probe assets
        run: docker build --target web --progress=plain .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run i18n:check
        working-directory: web
      - name: Notification and probe presentation behavior
        run: node --experimental-strip-types --test scripts/notification-policy.test.mjs scripts/probe-monitor.test.mjs
        working-directory: web
      - run: npm run build
        working-directory: web
  passkeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the actual admin UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Real WebAuthn registration, replay rejection, revocation and recovery
        env:
          POLARIS_PASSKEY_BROWSER_TEST: '1'
        run: |
          export POLARIS_CHROMIUM_BIN="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          go test -count=1 -v ./internal/panel -run '^TestLivePasskeyBrowser$'
      - name: Every admin page loads in a real browser (desktop, phone, English)
        env:
          POLARIS_PAGES_BROWSER_TEST: '1'
        run: |
          export POLARIS_CHROMIUM_BIN="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          go test -count=1 -v ./internal/panel -run '^TestLiveAdminPagesBrowser$'
      - name: Probe, appearance and settings workflows in Chromium and WebKit
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 --port 5187 > /tmp/probe-vite.log 2>&1 &
          probe_server_pid=$!
          trap 'kill "$probe_server_pid"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:5187/ > /dev/null
          python web/scripts/probe-refresh-ui-smoke.py
          python web/scripts/appearance-ui-smoke.py
          python web/scripts/settings-workflow-smoke.py
          python web/scripts/restore-drill-ui-smoke.py
          python web/scripts/admin-roles-ui-smoke.py
          python web/scripts/cdn-address-tools-ui-smoke.py
          python web/scripts/cdn-domains-ui-smoke.py
          python web/scripts/cdn-scheme-ui-smoke.py
          python web/scripts/cdn-check-ports-ui-smoke.py
          python web/scripts/rollout-result-ui-smoke.py
