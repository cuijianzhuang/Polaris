name: ci
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch real cores for integration tests
        run: |
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip && unzip -q xray.zip -d xray
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.13.5/sing-box-1.13.5-linux-amd64.tar.gz | tar xz
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.15/mihomo-linux-amd64-v1.19.15.gz | gunzip > mihomo && chmod +x mihomo
          mkdir -p gost && curl -fsSL https://github.com/go-gost/gost/releases/download/v3.2.6/gost_3.2.6_linux_amd64.tar.gz | tar xz -C gost
          mkdir -p pebble && curl -fsSL https://github.com/letsencrypt/pebble/releases/download/v2.7.0/pebble-linux-amd64.tar.gz | tar xz -C pebble --strip-components=3
          B=https://raw.githubusercontent.com/letsencrypt/pebble/v2.7.0/test
          curl -fsSL -o pebble/config.json $B/config/pebble-config.json
          curl -fsSL -o pebble/cert.pem $B/certs/localhost/cert.pem
          curl -fsSL -o pebble/key.pem $B/certs/localhost/key.pem
          curl -fsSL -o pebble/pebble.minica.pem $B/certs/pebble.minica.pem
          chmod +x pebble/pebble
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          POLARIS_XRAY_BIN: /tmp/cores/xray/xray
          POLARIS_SINGBOX_BIN: /tmp/cores/sing-box-1.13.5-linux-amd64/sing-box
          POLARIS_MIHOMO_BIN: /tmp/cores/mihomo
          POLARIS_GOST_BIN: /tmp/cores/gost/gost
          POLARIS_PEBBLE_DIR: /tmp/cores/pebble
      - name: Professional edition (polaris-pro sources, when PRO_TOKEN is available)
        env:
          PRO_TOKEN: ${{ secrets.PRO_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          POLARIS_XRAY_BIN: /tmp/cores/xray/xray
          POLARIS_SINGBOX_BIN: /tmp/cores/sing-box-1.13.5-linux-amd64/sing-box
          POLARIS_MIHOMO_BIN: /tmp/cores/mihomo
        run: |
          set -euo pipefail
          if [ -z "${PRO_TOKEN}" ]; then echo "PRO_TOKEN not available: community edition only"; exit 0; fi
          url="https://x-access-token:${PRO_TOKEN}@github.com/cuijianzhuang/polaris-pro.git"
          # the same branch name in polaris-pro when it exists, else main
          git clone -q --depth 1 --branch "$BRANCH" "$url" /tmp/polaris-pro 2>/dev/null || git clone -q --depth 1 "$url" /tmp/polaris-pro
          scripts/pro.sh copy /tmp/polaris-pro
          go vet -tags pro ./...
          go test -count=1 -tags pro ./internal/panel/ ./internal/agent/ ./internal/license/
          scripts/pro.sh clean
      - name: Firewall test with real iptables (isolated network namespace)
        run: go test -c -o /tmp/agent.test ./internal/agent && sudo env POLARIS_FW_REAL=1 unshare -n /tmp/agent.test -test.run TestFirewallIptablesReal -test.v
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run i18n:check
        working-directory: web
      - run: npm run build
        working-directory: web
