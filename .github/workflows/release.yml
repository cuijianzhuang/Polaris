name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build web UI
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - name: Build panel and agent
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/cuijianzhuang/polaris/internal/panel.Version=${VERSION} -X github.com/cuijianzhuang/polaris/internal/agent.Version=${VERSION}"
          mkdir -p dist build
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o dist/polaris-agent-linux-$arch ./cmd/agent
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o build/polaris ./cmd/panel
            tar -C build -czf dist/polaris-panel-${VERSION}-linux-$arch.tar.gz polaris \
              -C "$GITHUB_WORKSPACE/deploy" polaris.service polaris.env.example Caddyfile
            rm -f build/polaris
          done
          cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: Smoke test the binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./dist/polaris-agent-linux-amd64 --version | tee /dev/stderr | grep -F "$VERSION"
          tar -xzf dist/polaris-panel-${VERSION}-linux-amd64.tar.gz -C /tmp polaris
          /tmp/polaris --version | tee /dev/stderr | grep -F "$VERSION"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
