name: release
# Releases are cut from a v* tag pushed by hand (a "-" makes it a
# prerelease), from the Actions tab ("Run workflow", choosing patch /
# minor / major; always makes a new release, even when the commit was
# released before), or automatically when a merge lands on main: the
# version job bumps the patch number off the latest release tag and the
# binaries/image jobs publish it. Pushes to main still run the version
# and test jobs first, so main stays checked; a commit message containing
# "[skip release]" skips the release, and a HEAD that already carries a
# v* tag is not released twice. Automatic releases also require a business
# code change in the push: backend Go (cmd/, internal/, go.mod, go.sum)
# or frontend (web/src/, web/public/, web/*.go, web/package.json,
# web/package-lock.json, web/index.html, web/vite.config.*,
# web/tsconfig*.json). A push that only
# touches docs (*.md, docs/), scripts/, .github/, deploy/ or other
# non-code files does not release; tag pushes and manual runs always do.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 版本号递增方式
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

# Several merges in a row release only the newest: each run waits a little,
# then skips itself when main has moved on (GitHub keeps only the newest
# queued run), and checks again right before publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Releases come only from the cuijianzhuang copy; the mirror under the
    # organization must not cut versions of its own.
    if: github.repository_owner == 'cuijianzhuang'
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      epoch: ${{ steps.v.outputs.epoch }}
      builddate: ${{ steps.v.outputs.builddate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release only the newest commit on main
        id: latest
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT: 90
        run: |
          set -euo pipefail
          sleep "$WAIT"
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          # A newer commit that skips its own release must not stop this one.
          tipmsg=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tip}" --jq .commit.message)
          if [ "$tip" != "$GITHUB_SHA" ] && ! printf '%s' "$tipmsg" | grep -qiF '[skip release]'; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} has moved on to ${tip::7}; its run releases that instead of ${GITHUB_SHA::7}"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'patch' }}
          MSG: ${{ github.event.head_commit.message }}
          STALE: ${{ steps.latest.outputs.stale }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$STALE" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "a newer commit on main will be released"; exit 0
          fi
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME}"
          else
            if [ "${GITHUB_EVENT_NAME}" = push ] && printf '%s' "$MSG" | grep -qiF '[skip release]'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "skipped by commit message"; exit 0
            fi
            # A manual run always releases (e.g. to rebuild with new settings).
            if [ "${GITHUB_EVENT_NAME}" = push ] && git tag --points-at HEAD | grep -q '^v'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "HEAD is already released"; exit 0
            fi
            # Automatic releases need a business code change: a push that
            # only touches docs, scripts, workflow files or other non-code
            # files does not release. Tag pushes and manual runs skip this
            # check and always release. The range covers the whole push
            # (before..HEAD); a merge commit's first parent is the fallback
            # when before is missing or unusable.
            if [ "${GITHUB_EVENT_NAME}" = push ]; then
              before="${BEFORE:-}"
              if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
                if git rev-parse --verify -q HEAD^1 >/dev/null; then
                  range="HEAD^1..HEAD"
                else
                  range=""
                fi
              else
                range="$before..HEAD"
              fi
              if [ -n "$range" ]; then
                changed=$(git diff --name-only "$range")
              else
                changed=$(git ls-tree -r --name-only HEAD)
              fi
              if ! printf '%s\n' "$changed" | grep -qE '^(cmd/|internal/|go\.mod$|go\.sum$|web/src/|web/public/|web/[^/]*\.go$|web/package\.json$|web/package-lock\.json$|web/index\.html$|web/vite\.config\..+$|web/tsconfig[^/]*\.json$)'; then
                echo "skip=true" >> "$GITHUB_OUTPUT"; echo "no business code changed; skipping release"; exit 0
              fi
            fi
            last=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | head -n1)
            last=${last:-v0.0.0}
            IFS=. read -r ma mi pa <<< "${last#v}"
            case "$BUMP" in
              major) ma=$((ma + 1)); mi=0; pa=0 ;;
              minor) mi=$((mi + 1)); pa=0 ;;
              *) pa=$((pa + 1)) ;;
            esac
            v="v${ma}.${mi}.${pa}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          # Archive metadata uses the commit epoch. BuildDate is the license
          # release date: use this run's original creation date, stable on reruns.
          # Fail closed if the API lookup fails or returns an invalid timestamp.
          created_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at // empty')"
          if [[ ! "$created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::Missing or invalid workflow run creation timestamp"; exit 1
          fi
          builddate="$(date -u -d "$created_at" +%F)"
          epoch="$(git log -1 --format=%ct "${GITHUB_SHA}")"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "builddate=$builddate" >> "$GITHUB_OUTPUT"
          echo "Releasing $v (release date $builddate, archive epoch $epoch)"

  verified-checks:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.verify.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reuse successful PR browser/PostgreSQL checks only for the exact release tree
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/reuse-pr-checks.py

  test:
    needs: [version, verified-checks]
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      reuse_validated_checks: ${{ needs.verified-checks.outputs.reuse == 'true' }}
    secrets:
      PRO_TOKEN: ${{ secrets.PRO_TOKEN }}

  # Both editions in one release:
  #   community  polaris-panel-<v>-linux-<arch>.tar.gz      polaris-agent-linux-<arch>
  #   pro        polaris-panel-pro-<v>-linux-<arch>.tar.gz  polaris-agent-pro-linux-<arch>
  # The professional edition is compiled with the polaris-pro sources
  # (-tags pro) and needs a license; it is skipped, with a warning, when the
  # PRO_TOKEN secret is not set.
  binaries:
    needs: [version, test]
    # Tag releases, manual runs, and merges to main all publish; the
    # version job already decided the version (and the skips) above.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch the professional sources (polaris-pro)
        id: pro
        env:
          PRO_TOKEN: ${{ secrets.PRO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRO_TOKEN}" ]; then
            echo "::warning::PRO_TOKEN is not set: only the community edition is released"
            echo "dir=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git clone -q --depth 1 "https://x-access-token:${PRO_TOKEN}@github.com/cuijianzhuang/polaris-pro.git" "$RUNNER_TEMP/polaris-pro"
          echo "dir=$RUNNER_TEMP/polaris-pro" >> "$GITHUB_OUTPUT"
      - name: Build web UI
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - name: Build panel and agent (community, then pro)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          EPOCH: ${{ needs.version.outputs.epoch }}
          BUILDDATE: ${{ needs.version.outputs.builddate }}
          # License server public keys (base64, comma separated); empty = licenses not accepted yet.
          LICENSE_PUBKEYS: ${{ secrets.LICENSE_PUBKEYS }}
          LICENSE_SERVER: ${{ vars.LICENSE_SERVER }}
          PRO_DIR: ${{ steps.pro.outputs.dir }}
        run: |
          set -euo pipefail
          # Normalize compiler paths and archive metadata. Comparing rebuilds
          # also requires fixed VERSION, BUILDDATE, toolchains, web/dependency
          # inputs, pro sources and license configuration.
          export SOURCE_DATE_EPOCH="$EPOCH" CGO_ENABLED=0
          LDFLAGS="-s -w -X github.com/cuijianzhuang/polaris/internal/panel.Version=${VERSION} -X github.com/cuijianzhuang/polaris/internal/agent.Version=${VERSION}"
          LDFLAGS="$LDFLAGS -X github.com/cuijianzhuang/polaris/internal/panel.BuildDate=${BUILDDATE}"
          if [ -n "${LICENSE_PUBKEYS}" ]; then LDFLAGS="$LDFLAGS -X github.com/cuijianzhuang/polaris/internal/license.PublicKeys=${LICENSE_PUBKEYS}"; fi
          if [ -n "${LICENSE_SERVER}" ]; then LDFLAGS="$LDFLAGS -X github.com/cuijianzhuang/polaris/internal/panel.DefaultLicenseServer=${LICENSE_SERVER}"; fi
          mkdir -p dist build
          # Fixed archive metadata: owner/group 0, --mtime from the commit, no
          # atime/ctime records, gzip without the filename stamp. Members are
          # staged in one directory and named in sorted order below: GNU tar's
          # --sort only orders entries it discovers by recursing, never files
          # given on the command line, so passing --sort here would silently
          # do nothing.
          pack() { # $1: output archive; remaining args are sorted member names in build/
            local out="$1"; shift
            tar --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" \
              --format=gnu --create -C build "$@" | gzip -9n > "$out"
          }
          stage() { # normalize every member's mode regardless of checkout umask
            cp "$GITHUB_WORKSPACE"/deploy/polaris.service "$GITHUB_WORKSPACE"/deploy/polaris.env.example \
              "$GITHUB_WORKSPACE"/deploy/Caddyfile build/
            chmod 0755 build/polaris
            chmod 0644 build/polaris.service build/polaris.env.example build/Caddyfile
          }
          build() { # $1: build tags ("" or pro)
            local ep=${1:+$1-}
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -tags "$1" -ldflags "$LDFLAGS" -o dist/polaris-agent-${ep}linux-$arch ./cmd/agent
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -tags "$1" -ldflags "$LDFLAGS" -o build/polaris ./cmd/panel
              stage
              pack dist/polaris-panel-${ep}${VERSION}-linux-$arch.tar.gz \
                Caddyfile polaris polaris.env.example polaris.service
              rm -f build/polaris build/polaris.service build/polaris.env.example build/Caddyfile
            done
          }
          build ""
          if [ -n "${PRO_DIR}" ]; then
            scripts/pro.sh copy "$PRO_DIR"
            build pro
            scripts/pro.sh clean
          fi
          cp scripts/install-panel.sh dist/
          # Sort in the C locale: the shell's glob order follows the runner
          # locale, which would otherwise reorder this file between machines.
          (cd dist && sha256sum -- * | LC_ALL=C sort -k2 > checksums.txt && cat checksums.txt)
      - name: Smoke test the binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ./dist/polaris-agent-linux-amd64 --version | tee /dev/stderr | grep -F "$VERSION"
          mkdir -p /tmp/c /tmp/p
          tar -xzf dist/polaris-panel-${VERSION}-linux-amd64.tar.gz -C /tmp/c polaris
          /tmp/c/polaris --version | tee /dev/stderr | grep -qx "polaris ${VERSION} community"
          if [ -f dist/polaris-panel-pro-${VERSION}-linux-amd64.tar.gz ]; then
            ./dist/polaris-agent-pro-linux-amd64 --version | tee /dev/stderr | grep -F "$VERSION"
            tar -xzf dist/polaris-panel-pro-${VERSION}-linux-amd64.tar.gz -C /tmp/p polaris
            /tmp/p/polaris --version | tee /dev/stderr | grep -qx "polaris ${VERSION} pro"
          fi
      - name: Release only the newest commit on main
        id: latest
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT: 0
        run: |
          set -euo pipefail
          sleep "$WAIT"
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          # A newer commit that skips its own release must not stop this one.
          tipmsg=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tip}" --jq .commit.message)
          if [ "$tip" != "$GITHUB_SHA" ] && ! printf '%s' "$tipmsg" | grep -qiF '[skip release]'; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} has moved on to ${tip::7}; its run releases that instead of ${GITHUB_SHA::7}"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: steps.latest.outputs.stale != 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when the release was not started by one.
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            **两个版本**（同一版本号，数据和配置通用，可以随时切换）：

            | | 面板 | Agent | Docker |
            |---|---|---|---|
            | 社区版（开源） | `polaris-panel-<版本>-linux-<架构>.tar.gz` | `polaris-agent-linux-<架构>` | `ghcr.io/cuijianzhuang/polaris:<版本>` |
            | 专业版（需要许可证） | `polaris-panel-pro-<版本>-linux-<架构>.tar.gz` | `polaris-agent-pro-linux-<架构>` | `ghcr.io/cuijianzhuang/polaris:<版本>-pro` |

            安装专业版：安装命令加 `--pro`；已安装的面板执行 `polaris update --pro` 切换（`--community` 切回社区版）。之后的升级会沿用当前版本，节点 Agent 也会自动使用对应版本。
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

  image:
    needs: [version, test]
    # Tag releases, manual runs, and merges to main all publish; the
    # version job already decided the version (and the skips) above.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [community, pro]
    steps:
      - uses: actions/checkout@v4
      - name: Release only the newest commit on main
        id: latest
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT: 0
        run: |
          set -euo pipefail
          sleep "$WAIT"
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          # A newer commit that skips its own release must not stop this one.
          tipmsg=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tip}" --jq .commit.message)
          if [ "$tip" != "$GITHUB_SHA" ] && ! printf '%s' "$tipmsg" | grep -qiF '[skip release]'; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} has moved on to ${tip::7}; its run releases that instead of ${GITHUB_SHA::7}"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Add the professional sources (polaris-pro)
        id: pro
        if: matrix.edition == 'pro'
        env:
          PRO_TOKEN: ${{ secrets.PRO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRO_TOKEN}" ]; then
            echo "::warning::PRO_TOKEN is not set: no professional image"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git clone -q --depth 1 "https://x-access-token:${PRO_TOKEN}@github.com/cuijianzhuang/polaris-pro.git" "$RUNNER_TEMP/polaris-pro"
          scripts/pro.sh copy "$RUNNER_TEMP/polaris-pro"
          rm -rf "$RUNNER_TEMP/polaris-pro"
      - uses: docker/setup-qemu-action@v3
        if: steps.pro.outputs.skip != 'true' && steps.latest.outputs.stale != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.pro.outputs.skip != 'true' && steps.latest.outputs.stale != 'true'
      - uses: docker/login-action@v3
        if: steps.pro.outputs.skip != 'true' && steps.latest.outputs.stale != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.pro.outputs.skip != 'true' && steps.latest.outputs.stale != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # community: 1.2.3, 1.2, latest — pro: 1.2.3-pro, 1.2-pro, latest-pro
          flavor: |
            latest=false
            suffix=${{ matrix.edition == 'pro' && '-pro' || '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease != 'true' }}
      - uses: docker/build-push-action@v6
        if: steps.pro.outputs.skip != 'true' && steps.latest.outputs.stale != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILDDATE=${{ needs.version.outputs.builddate }}
            LICENSE_PUBKEYS=${{ secrets.LICENSE_PUBKEYS }}
            LICENSE_SERVER=${{ vars.LICENSE_SERVER }}
            TAGS=${{ matrix.edition == 'pro' && 'pro' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.edition }}
          cache-to: type=gha,mode=max,scope=${{ matrix.edition }}
