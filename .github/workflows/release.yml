name: release
# Releases happen automatically on every push to main (patch bump from the
# latest tag; put "[skip release]" in the commit message to skip), from the
# Actions tab ("Run workflow", choosing patch / minor / major), or by pushing
# a v* tag by hand (a "-" makes it a prerelease).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 版本号递增方式
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME}"
          else
            if [ "${GITHUB_EVENT_NAME}" = push ] && printf '%s' "$MSG" | grep -qiF '[skip release]'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "skipped by commit message"; exit 0
            fi
            if git tag --points-at HEAD | grep -q '^v'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "HEAD is already released"; exit 0
            fi
            last=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | head -n1)
            last=${last:-v0.0.0}
            IFS=. read -r ma mi pa <<< "${last#v}"
            case "$BUMP" in
              major) ma=$((ma + 1)); mi=0; pa=0 ;;
              minor) mi=$((mi + 1)); pa=0 ;;
              *) pa=$((pa + 1)) ;;
            esac
            v="v${ma}.${mi}.${pa}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "Releasing $v"

  test:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build web UI
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - name: Build panel and agent
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/cuijianzhuang/polaris/internal/panel.Version=${VERSION} -X github.com/cuijianzhuang/polaris/internal/agent.Version=${VERSION}"
          mkdir -p dist build
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o dist/polaris-agent-linux-$arch ./cmd/agent
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o build/polaris ./cmd/panel
            tar -C build -czf dist/polaris-panel-${VERSION}-linux-$arch.tar.gz polaris \
              -C "$GITHUB_WORKSPACE/deploy" polaris.service polaris.env.example Caddyfile
            rm -f build/polaris
          done
          cp scripts/install-panel.sh dist/
          cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: Smoke test the binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ./dist/polaris-agent-linux-amd64 --version | tee /dev/stderr | grep -F "$VERSION"
          tar -xzf dist/polaris-panel-${VERSION}-linux-amd64.tar.gz -C /tmp polaris
          /tmp/polaris --version | tee /dev/stderr | grep -F "$VERSION"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when the release was not started by one.
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

  image:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease != 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
