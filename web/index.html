<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181C">
<meta name="robots" content="noindex,nofollow">
<title>Polaris</title>
<script>try{var t=JSON.parse(localStorage.getItem('polaris.theme')||'{}'),d=t.mode==='dark'||(t.mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.mode=d?'dark':'light';document.documentElement.dataset.accent=t.accent&&t.accent!=='auto'?t.accent:({warm:'amber',midnight:'ice'})[t.style]||'slate'}catch(e){}</script>
<link data-polaris-icon rel="icon" type="image/png" href="/src/assets/polaris-icon-128.png">
<link data-polaris-icon rel="apple-touch-icon" href="/src/assets/polaris-icon-180.png">
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8a94a6;font:600 18px system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.02em">Polaris</div></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
